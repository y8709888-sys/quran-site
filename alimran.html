
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سورة آل عمران</title>

    <link rel="stylesheet" href="ghjk.css">

    <style>
        body {
            font-family: "Amiri", serif;
            background: #fff;
            color: #222;
            padding: 20px;
            line-height: 2.2;
        }

        h1 {
            text-align: center;
        }

        #ayahs {
            font-family: "Amiri", serif;
    font-size: 32px;
    color: #222;
    line-height: 2.3;
    text-align: justify;
    font-weight: normal;
        }
    </style>
</head>
<body>

    <h1 id="surahTitle">سورة آل عمران</h1>

    <div id="ayahs">جاري تحميل الآيات...</div>

    <script>
        fetch ("https://api.alquran.cloud/v1/surah/3")
            .then(response => {
                if (!response.ok) {
                    throw new Error("فشل الاتصال");
                }
                return response.json();
            })
            .then(data => {
                const surah = data.data;

                document.getElementById("surahTitle").textContent =
                    "سورة آل عمران";

                document.getElementById("ayahs").textContent =
                    surah.ayahs.map(ayah =>
                        ayah.text + " ۞"
                    ).join(" ");
            })
            .catch(() => {
                document.getElementById("ayahs").textContent =
                    "تعذّر تحميل الآيات. تأكد من اتصالك بالإنترنت.";
            });
    </script>

</body>
</html>
