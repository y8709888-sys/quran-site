
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> سورة الفاتحة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="ghjk.css">

    <style>
        body {
           body {
    font-family: "Amiri", serif !important;
}
            background: #fff;
            color: #222;
            padding: 20px;
            line-height: 2.2;
        }

        h1 {
            text-align: center;
        }

        #ayahs {
            font-size: 27px;
            text-align: justify;
        }
    </style>
</head>
<body>

    <h1 id="surahTitle">سورة الفاتحة</h1>

    <div id="ayahs">جاري تحميل الآيات...</div>

    <script>
        fetch("https://api.alquran.cloud/v1/surah/1")
            .then(response => response.json())
            .then(data => {
                const surah = data.data;

                document.getElementById("surahTitle").textContent =
                    "سورة" + surah.name;

                document.getElementById("ayahs").textContent =
                    surah.ayahs.map(ayah =>
                        ayah.text + " ۞"
                    ).join(" ");
            })
            .catch(() => {
                document.getElementById("ayahs").textContent =
                    "تعذّر تحميل الآيات. تأكد من اتصالك بالإنترنت.";
            });
    </script>

</body>
</html>
